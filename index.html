<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSJV Skills Transition Dashboard</title>
<style>
  :root{
    --green:#1a9b73; --green-d:#1a7f57; --green-bg:#d9ece2; --green-tx:#276b4f;
    --gold:#e8971e; --gold-d:#a8791f; --gold-bg:#f5e9d6; --gold-tx:#6f5322;
    --red:#b0433b; --red-bg:#f6e8e8; --red-tx:#7d3a37;
    --ink:#232a2f; --muted:#7c8894; --line:#e9edf1; --bg:#eef1f4;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:22px 16px;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg);line-height:1.45}
  .shell{max-width:1380px;margin:0 auto}
  .lead{font-size:14.5px;color:var(--muted);margin:0 0 12px 4px}
  .about{max-width:1100px;margin:0 0 16px 2px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .about > summary{cursor:pointer;padding:12px 16px;font-weight:600;color:var(--ink);font-size:14px;
        list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
  .about > summary::-webkit-details-marker{display:none}
  .about > summary::before{content:'\25B8';color:var(--muted);font-size:12px;transition:transform .15s}
  .about[open] > summary::before{transform:rotate(90deg)}
  .about[open] > summary{border-bottom:1px solid var(--line)}
  #aboutBody{padding:14px 16px 4px}

  .card{background:#fff;border:1px solid #e2e7ec;border-radius:18px;
        padding:26px 34px 30px;box-shadow:0 1px 3px rgba(30,50,70,.05)}

  /* header with inline dropdowns */
  .head{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .titleline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .hsel{appearance:none;-webkit-appearance:none;border:none;background:transparent;
        font-family:inherit;font-size:25px;font-weight:700;cursor:pointer;line-height:1.1;
        padding:2px 22px 2px 6px;margin:-2px 0;border-radius:8px;
        background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2399a4ae' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
        background-repeat:no-repeat;background-position:right 2px center}
  .hsel:hover{background-color:#f2f5f7}
  .hsel:focus{outline:none;background-color:#eef4f1}
  .hsel.feeder{color:#20272c}
  .hsel.target{color:var(--green)}
  .arrow{color:#b6bfc7;font-size:24px;font-weight:400}
  .transfer{font-size:16px;color:var(--muted);white-space:nowrap}
  .transfer b{color:var(--ink)}

  /* NSJV workforce readout */
  .workforce{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0 2px}
  .wfpill{display:inline-flex;align-items:baseline;gap:6px;font-size:14px;
          padding:7px 14px;border-radius:9px;white-space:nowrap}
  .wfpill .n{font-size:19px;font-weight:700;line-height:1}
  .wfpill .lbl{font-size:12.5px;opacity:.85}
  .wf-f{background:#eef2f5;color:#3c4a55}
  .wf-f .n{color:#20272c}
  .wf-t{background:var(--green-bg);color:var(--green-tx)}
  .wf-t .n{color:var(--green-d)}
  .wf-np{background:#f1f3f5;color:var(--muted)}
  .wfnote{font-size:12px;color:var(--muted)}

  .bar{display:flex;gap:3px;height:14px;margin:18px 0 24px}
  .bar span{display:block;border-radius:7px}
  .bar .g{background:var(--green)} .bar .o{background:var(--gold)}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:30px}
  @media(max-width:640px){.cols{grid-template-columns:1fr;gap:22px}}
  .colhead{font-size:16px;font-weight:700;margin:0 0 12px}
  .asset .colhead{color:var(--green-d)} .gap .colhead{color:var(--gold-d)}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{font-size:15px;padding:8px 15px;border-radius:8px;white-space:nowrap}
  .chip.a{background:var(--green-bg);color:var(--green-tx)}
  .chip.b{background:var(--gold-bg);color:var(--gold-tx)}
  .none{font-size:14px;color:var(--muted);font-style:italic;padding:4px 2px}

  .rule{height:1px;background:var(--line);margin:26px 0 20px}
  .barhead{font-size:16px;font-weight:700;color:var(--red);margin:0 0 14px}
  .barriers{display:flex;flex-wrap:wrap;gap:12px}
  .barrier{background:var(--red-bg);color:var(--red-tx);border-radius:9px;
           padding:13px 18px;font-size:15px;cursor:default}
  .nobar{font-size:15px;color:var(--muted);font-style:italic}
  .notes{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:14px}
  .noteslbl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--gold-d)}
  .note{background:#fbf3e3;color:var(--gold-tx);border:1px solid #efe1c4;
        border-radius:8px;padding:7px 13px;font-size:14px;cursor:default}

  .foot{font-size:13.5px;color:var(--muted);margin:20px 2px 4px;max-width:1100px}
  .foottitle{font-size:15.5px;font-weight:700;color:var(--ink);margin:0 0 6px}
  .footlead{margin:0 0 14px;line-height:1.5}
  .footdefs{display:grid;grid-template-columns:1fr 1fr;gap:8px 30px;margin:0 0 14px}
  @media(max-width:700px){.footdefs{grid-template-columns:1fr}}
  .footdefs > div{line-height:1.45}
  .footdefs .term{font-weight:600;color:var(--ink)}
  .foottip{margin:0 0 14px;font-style:italic}
  .footcredit{margin:0;padding-top:12px;border-top:1px solid var(--line);line-height:1.55;font-size:14.5px}
  .footcredit b{color:var(--ink)}

  #packcard{margin-top:18px}
  .pktitle{font-size:18px;font-weight:700;color:var(--ink);margin:0 0 3px}
  .pkhead{font-size:14px;color:var(--muted);margin:0 0 10px}
  .pkhead b{color:var(--ink)}
  .pklegend{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:12px;color:var(--muted);margin-bottom:4px}
  .pklegend .lg{display:flex;align-items:center;gap:5px}
  .pklegend i{width:12px;height:12px;border-radius:50%;display:inline-block}
  .pk{cursor:pointer}
  .pk:hover circle{fill-opacity:1}
</style>
</head>

// greedy word-wrap into at most maxLines lines of ~maxChars; remainder ellipsized onto the last line
function wrapLabel(str, maxChars, maxLines){
  const words=String(str).split(/\s+/), lines=[]; let cur='';
  for(let i=0;i<words.length;i++){
    const w=words[i], test = cur ? cur+' '+w : w;
    if(test.length<=maxChars || !cur){ cur=test; }
    else {
      lines.push(cur); cur=w;
      if(lines.length===maxLines-1){
        let rest=words.slice(i).join(' ');
        if(rest.length>maxChars) rest=rest.slice(0,maxChars-1)+'…';
        lines.push(rest); return lines;
      }
    }
  }
  if(cur) lines.push(cur);
  return lines;
}

  for(let it=0; it<340; it++){
    for(const n of nodes){
      const dx=n.x-cx, dy=n.y-cy, d=Math.hypot(dx,dy)||0.01, ang=Math.atan2(dy,dx);
      const nr = d + (n.tr-d)*0.18;
      n.x=cx+Math.cos(ang)*nr; n.y=cy+Math.sin(ang)*nr;
    }
    for(let i=0;i<nodes.length;i++){
      const A=nodes[i]; let dx=A.x-cx, dy=A.y-cy, d=Math.hypot(dx,dy)||0.01, min=Rt+Rb+pad;
      if(d<min){ A.x=cx+dx/d*min; A.y=cy+dy/d*min; }
      for(let j=i+1;j<nodes.length;j++){
        const B=nodes[j]; let ex=B.x-A.x, ey=B.y-A.y, dd=Math.hypot(ex,ey)||0.01, mn=Rb*2+pad;
        if(dd<mn){ const p=(mn-dd)/2/dd; A.x-=ex*p; A.y-=ey*p; B.x+=ex*p; B.y+=ey*p; }
      }
    }
  }
  for(const n of nodes){ n.x=Math.max(Rb+2,Math.min(W-Rb-2,n.x)); n.y=Math.max(Rb+2,Math.min(H-Rb-2,n.y)); }

  let rings='';
  for(const q of [0.25,0.5,0.75,1]){ const r=(Rin+q*(Rout-Rin)).toFixed(1);
    rings+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#d7dde3" stroke-width="1" stroke-dasharray="2 5"/>`; }
  let bub='';
  const FS=8.2, LH=8.6, MAXCH=13, NFS=8.2, GAP=8;
  for(const n of nodes){
    const sel = n.idx===fi, c = packCol(n.gap/t.total);
    const lines = wrapLabel(SHORT[n.name]||n.name, MAXCH, 3);
    const emp = empN(n.name);
    const empStr = emp==null ? 'n/a' : fmtN(emp);
    const nameH = (lines.length-1)*LH;                 // span between first and last name baseline
    const y0 = n.y - (nameH + GAP)/2 + 2;              // first name baseline (block shifted up for the number)
    const yNum = y0 + nameH + GAP;                     // worker-count baseline, below the name
    const label = lines.map((ln,i)=>`<tspan x="${n.x.toFixed(1)}" dy="${i===0?0:LH}">${esc(ln)}</tspan>`).join('');
    bub+=`<g class="pk" onclick="onFeeder(${n.idx})">
      <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${Rb}" fill="${c}" fill-opacity="${sel?1:0.9}"
        stroke="${sel?'#20272c':'#ffffff'}" stroke-width="${sel?3:1.5}">
        <title>${esc(n.name)}${n.code?' ('+n.code+')':''} — gap ${n.gap}, ${t.total-n.gap} of ${t.total} transfer${emp==null?' · NSJV workforce not published':' · '+fmtN(emp)+' NSJV workers'}</title></circle>
      <text x="${n.x.toFixed(1)}" y="${y0.toFixed(1)}" text-anchor="middle" font-size="${FS}" font-weight="600" fill="#fff" pointer-events="none">${label}</text>
      <text x="${n.x.toFixed(1)}" y="${yNum.toFixed(1)}" text-anchor="middle" font-size="${NFS}" font-weight="700" fill="#fff" fill-opacity="0.95" pointer-events="none">${esc(empStr)}</text>
    </g>`;
  }
  const feederSum = t.feeders.reduce((s,f)=> s + (empN(f.name)||0), 0);
  const ts = TSHORT[t.code]||t.name;
  const center = `<circle cx="${cx}" cy="${cy}" r="${Rt}" fill="#0F6E56"><title>${esc(t.name)} — ${fmtN(empN(t.name))} NSJV workers</title></circle>
    <text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">${esc(ts)}</text>`;

  document.getElementById('packcard').innerHTML = `
    <div class="pktitle">Feeder cluster</div>
    <div class="pkhead">The closer a bubble sits to <b>${esc(t.name)}</b>, the smaller its training gap. ${t.feeders.length} feeders, employing about <b>${fmtN(feederSum)}</b> NSJV workers combined (published counts) versus <b>${fmtN(empN(t.name))}</b> in the target role.</div>
    <div class="pklegend">
      <span>best fit</span>
      <span class="lg"><i style="background:#1D9E75"></i></span>
      <span class="lg"><i style="background:#EF9F27"></i></span>
      <span class="lg"><i style="background:#D85A30"></i></span>
      <span class="lg"><i style="background:#E24B4A"></i></span>
      <span>more to learn &nbsp;·&nbsp; bold number = NSJV workers &nbsp;·&nbsp; click a bubble to load it above &nbsp;·&nbsp; hover for full name &amp; SOC code</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Feeder occupation cluster for ${esc(t.name)}">
      ${rings}${bub}${center}
    </svg>`;
}

function feederOrder(t){ // best fit (smallest gap) first
  return t.feeders.map((f,idx)=>({f,idx})).sort((a,b)=>a.f.gap-b.f.gap || alreadyOf(b.f)-alreadyOf(a.f));
}
function chips(items,cls){
  if(!items.length) return `<div class="none">none</div>`;
  return `<div class="chips">`+items.map(x=>`<span class="chip ${cls}" title="${esc(x)}">${esc(lab(x))}</span>`).join('')+`</div>`;
}

function render(){
  const t = DATA.targets[ti], f = t.feeders[fi];
  const has = alreadyOf(f), pctG = Math.round(has/t.total*100), pctO = 100-pctG;
  const e = t.entry;
  const items = BARRIER[t.code] || [];
  const barriers = items.filter(x=>x.k==='barrier');
  const notes = items.filter(x=>x.k==='note');
  // order chips: knowledge first, then skills (matches mockup); drop any blanks
  const clean = a => (a||[]).filter(x => x && String(x).trim() !== '');
  const asset = clean(f.kHas).concat(clean(f.sHas));
  const learn = clean(f.kBuild).concat(clean(f.sBuild));

  const feederOpts = feederOrder(t).map(({f:ff,idx})=>
     `<option value="${idx}" ${idx===fi?'selected':''}>${esc(ff.name)}  (${alreadyOf(ff)}/${t.total})</option>`).join('');
  const targetOpts = DATA.targets.map((tt,i)=>
     `<option value="${i}" ${i===ti?'selected':''}>${esc(tt.name)}</option>`).join('');

  document.getElementById('card').innerHTML = `
    <div class="head">
      <div class="titleline">
        <select class="hsel feeder" id="fsel" onchange="onFeeder(this.value)" title="Change feeder occupation">${feederOpts}</select>
        <span class="arrow">&rarr;</span>
        <select class="hsel target" id="tsel" onchange="onTarget(this.value)" title="Change target occupation">${targetOpts}</select>
      </div>
      <div class="transfer"><b>${has} of ${t.total}</b> competencies transfer</div>
      <div class="workforce">
        ${empN(f.name)==null
          ? `<span class="wfpill wf-np" title="BLS does not publish a regional employment count for this occupation"><span class="lbl">Feeder workforce not published</span></span>`
          : `<span class="wfpill wf-f" title="${esc(f.name)} — NSJV three-county employment, BLS OEWS May 2024"><span class="n">${fmtN(empN(f.name))}</span><span class="lbl">workers in this feeder</span></span>`}
        <span class="arrow" style="font-size:16px">&rarr;</span>
        <span class="wfpill wf-t" title="${esc(t.name)} — NSJV three-county employment, BLS OEWS May 2024"><span class="n">${fmtN(empN(t.name))}</span><span class="lbl">workers in the target role</span></span>
        <span class="wfnote">NSJV three-county region, 2024</span>
      </div>
    </div>

    <div class="bar"><span class="g" style="flex:${pctG}"></span><span class="o" style="flex:${pctO}"></span></div>

    <div class="cols">
      <div class="col asset"><div class="colhead">brings in (asset)</div>${chips(asset,'a')}</div>
      <div class="col gap"><div class="colhead">must learn (teachable gap)</div>${chips(learn,'b')}</div>
    </div>

    <div class="rule"></div>
    <div class="barhead">barriers to entry (not teachable in a course)</div>
    ${barriers.length
      ? `<div class="barriers">`+barriers.map(x=>`<div class="barrier" title="${esc(e[x.src])}">${esc(x.l)}</div>`).join('')+`</div>`
      : `<div class="nobar">No hard barriers to entry for this occupation.</div>`}
    ${notes.length
      ? `<div class="notes"><span class="noteslbl">not a barrier</span>`+notes.map(x=>`<span class="note" title="${esc(e[x.src])}">${esc(x.l)}</span>`).join('')+`</div>`
      : ``}`;

  // size the header selects to their content so they read like text, not full-width boxes
  ['fsel','tsel'].forEach(sizeSelect);
  renderPack();
}

function sizeSelect(id){
  const sel = document.getElementById(id);
  const probe = document.createElement('span');
  probe.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:'+getComputedStyle(sel).font;
  probe.textContent = sel.options[sel.selectedIndex].text;
  document.body.appendChild(probe);
  sel.style.width = (probe.offsetWidth + 34) + 'px';
  document.body.removeChild(probe);
}

function onTarget(v){ ti=+v; fi=feederOrder(DATA.targets[ti])[0].idx; render(); }
function onFeeder(v){ fi=+v; render(); }

document.getElementById('aboutBody').innerHTML = `
  <p class="footlead">For each of the four target occupations and a selected feeder occupation, this dashboard shows the O*NET Knowledge and Skills a worker already brings in, the ones they would still need to learn, and the structural barriers to entering the occupation. The bubble cluster groups every feeder occupation by how small its training gap is. Only attributes O*NET rates as important to an occupation — an Importance rating above 3 on the 1–5 scale — are counted.</p>
  <div class="footdefs">
    <div><span class="term">Brings in (asset)</span> — important for both the feeder and the target: transferable strengths the worker already has.</div>
    <div><span class="term">Must learn (teachable gap)</span> — important for the target but not the feeder: the training gap a program can close.</div>
    <div><span class="term">Barriers to entry</span> — structural requirements such as apprenticeship, license, or preparation level that a course cannot teach.</div>
    <div><span class="term">X of Y competencies transfer</span> — how many of the target's important attributes the feeder already brings in.</div>
    <div><span class="term">Feeder cluster</span> — each feeder is a bubble; the closer it sits to the target at the center, the smaller its training gap.</div>
  </div>
  <p class="foottip">Tip: use the dropdowns to change the feeder or target occupation, click a bubble to load that feeder, and hover any colored label or bubble for its full O*NET name and details.</p>`;

document.getElementById('foot').innerHTML = `
  <p class="footcredit">
    Data: O*NET 30.3 (Knowledge, essential and transferable Skills); entry requirements from the U.S. Bureau of Labor Statistics Occupational Outlook Handbook and O*NET. Updated on 2026-08-04.<br>
    Prepared by Esra Gul, Center for Business and Policy Research at the University of the Pacific.
  </p>`;

render();
</script>
